[package]
name = "subspace_conduit"
version = "0.1.0"
edition = "2024"

[dependencies]
subspace_conduit_core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "fs"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
rustls = "0.23"
tokio-rustls = "0.26"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
